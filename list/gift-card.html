<template id="gift-card-template">
    <img class="gift-card-image" data-gift-image>
    <div class="gift-card-details">
        <h2 class="gift-card-name"><a data-gift-name></a></h2>
        <p class="gift-card-artist">Artist: <a data-gift-artist></a></p>
        <p class="gift-card-price" data-gift-price></p>
        <p class="gift-card-description">Description: <span data-gift-description></span></p>
        <section class="gift-card-tags" aria-label="Gift tags">
            <p class="gift-card-tags-label">Tags:</p>
            <div class="gift-card-tag-list" data-gift-tags></div>
        </section>
    </div>
</template>
